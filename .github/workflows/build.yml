name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and copy QuickCut code in
        run: |
          flutter create --platforms=android --project-name quickcut --org com.quickcut build_app
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp -r assets build_app/assets
          cp pubspec.yaml build_app/pubspec.yaml

      - name: Patch Android settings (AdMob ID, permissions, minSdk)
        run: python3 tools/patch_android.py build_app

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: quickcut-apk
          path: build_app/build/app/outputs/flutter-apk/*.apk
